
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07130f">
  <title>Account Verification</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #07130f;
      --card: #10231b;
      --green: #20d890;
      --green-light: #75ffc0;
      --text: #f3fff9;
      --muted: #9bb8aa;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, #174c36 0%, transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .background-glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: var(--green);
      filter: blur(130px);
      opacity: .13;
      animation: glow 5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes glow {
      from { transform: scale(.8); opacity: .08; }
      to { transform: scale(1.3); opacity: .2; }
    }

    .container {
      width: 100%;
      max-width: 410px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .card {
      padding: 36px 25px;
      border: 1px solid rgba(117, 255, 192, .13);
      border-radius: 26px;
      background: rgba(16, 35, 27, .92);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .35);
      backdrop-filter: blur(15px);
      animation: cardIn .7s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(145deg, #1c9d69, #0b573c);
      box-shadow: 0 0 35px rgba(32, 216, 144, .22);
      animation: float 3s ease-in-out infinite;
    }

    .logo svg {
      width: 46px;
      height: 46px;
      stroke: white;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 25px;
      margin-bottom: 12px;
      letter-spacing: -.5px;
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 27px;
    }

    .status {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px;
      border-radius: 15px;
      background: rgba(255, 255, 255, .045);
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 19px;
      height: 19px;
      border: 2px solid rgba(255, 255, 255, .18);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-icon {
      width: 23px;
      height: 23px;
      color: var(--green-light);
      animation: pop .45s cubic-bezier(.2, 1.6, .5, 1) both;
    }

    @keyframes pop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .status.success {
      color: var(--green-light);
      background: rgba(32, 216, 144, .09);
      border: 1px solid rgba(32, 216, 144, .18);
    }

    .status.error {
      color: #ff9b9b;
      background: rgba(255, 70, 70, .07);
      border: 1px solid rgba(255, 70, 70, .15);
    }

    .user-info {
      display: none;
      margin-top: 20px;
      padding: 17px;
      border-radius: 15px;
      background: rgba(255, 255, 255, .04);
      text-align: left;
      animation: cardIn .5s ease both;
    }

    .user-info.show {
      display: block;
    }

    .user-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .user-id {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .footer {
      color: #668577;
      font-size: 11px;
      margin-top: 23px;
    }

    .retry {
      display: none;
      margin-top: 17px;
      padding: 12px 22px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #062116;
      font-weight: bold;
      cursor: pointer;
    }

    .retry.show {
      display: inline-block;
    }

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green-light);
      opacity: 0;
      animation: rise 7s linear infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
      }
      15% { opacity: .6; }
      85% { opacity: .3; }
      100% {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="background-glow"></div>
  <div class="particles" id="particles"></div>

  <main class="container">
    <section class="card">

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 3L4 7v5c0 5 3.5 8 8 9 4.5-1 8-4 8-9V7l-8-4z"/>
          <path d="m8.5 12 2.3 2.3 4.7-5"/>
        </svg>
      </div>

      <h1 id="title">Welcome</h1>

      <p class="description" id="description">
        Please wait while we securely verify your Telegram account.
      </p>

      <div class="status" id="status">
        <span class="spinner"></span>
        <span id="statusText">Connecting to server...</span>
      </div>

      <div class="user-info" id="userInfo">
        <div class="user-label">Verified Telegram Account</div>
        <div class="user-name" id="userName">User</div>
        <div class="user-id" id="userId"></div>
      </div>

      <button class="retry" id="retryButton" onclick="authenticate()">
        Try Again
      </button>

      <div class="footer">
        Secure Telegram Mini App
      </div>

    </section>
  </main>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================

    const API_URL = "https://mrabdubot.vercel.app";

    const tg = window.Telegram?.WebApp;

    // ==========================================
    // TELEGRAM INITIALIZATION
    // ==========================================

    if (tg) {
      tg.ready();
      tg.expand();

      try {
        tg.setHeaderColor("#07130f");
        tg.setBackgroundColor("#07130f");
      } catch (error) {
        console.log("Theme setup skipped.");
      }
    }

    // ==========================================
    // PARTICLE ANIMATION
    // ==========================================

    const particles = document.getElementById("particles");

    for (let i = 0; i < 22; i++) {
      const particle = document.createElement("div");

      particle.className = "particle";
      particle.style.left = Math.random() * 100 + "%";
      particle.style.animationDelay = Math.random() * 7 + "s";
      particle.style.animationDuration = (5 + Math.random() * 6) + "s";

      particles.appendChild(particle);
    }

    // ==========================================
    // DEVICE ID
    // ==========================================

    function getDeviceId() {
      let deviceId = localStorage.getItem("mini_device_id");

      if (!deviceId) {
        if (window.crypto && crypto.randomUUID) {
          deviceId = crypto.randomUUID();
        } else {
          deviceId =
            "device-" +
            Date.now() +
            "-" +
            Math.random().toString(36).slice(2);
        }

        localStorage.setItem("mini_device_id", deviceId);
      }

      return deviceId;
    }

    // ==========================================
    // UI HELPERS
    // ==========================================

    function setLoading(message) {
      const status = document.getElementById("status");

      status.className = "status";
      status.innerHTML = `
        <span class="spinner"></span>
        <span id="statusText">${message}</span>
      `;

      document.getElementById("retryButton").classList.remove("show");
    }

    function setSuccess(user) {
      document.getElementById("title").textContent = "Verification Complete";

      document.getElementById("description").textContent =
        "Your Telegram account has been successfully verified. You can continue.";

      const status = document.getElementById("status");

      status.className = "status success";
      status.innerHTML = `
        <svg class="success-icon" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12 4 4L19 6"/>
        </svg>
        <span>Account successfully verified</span>
      `;

      const fullName = [
        user.first_name || "",
        user.last_name || ""
      ].join(" ").trim();

      document.getElementById("userName").textContent =
        fullName || user.username || "Telegram User";

      document.getElementById("userId").textContent =
        "Telegram ID: " + user.id;

      document.getElementById("userInfo").classList.add("show");

      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred("success");
      }
    }

    function setError(message) {
      document.getElementById("title").textContent = "Verification Failed";

      document.getElementById("description").textContent =
        "We couldn't verify your account. Please try again.";

      const status = document.getElementById("status");

      status.className = "status error";
      status.textContent = message;

      document.getElementById("retryButton").classList.add("show");
    }

    // ==========================================
    // AUTHENTICATION
    // ==========================================

    async function authenticate() {
      setLoading("Verifying your Telegram account...");

      document.getElementById("userInfo").classList.remove("show");

      if (!tg || !tg.initData) {
        setError("Please open this page using the Telegram Mini App.");
        return;
      }

      try {
        const response = await fetch(API_URL + "/api/auth", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-init-data": tg.initData,
            "x-device": getDeviceId()
          },
          body: JSON.stringify({})
        });

        const data = await response.json();

        if (!response.ok || !data.ok || !data.user) {
          throw new Error(
            data.message || "Authentication failed."
          );
        }

        setSuccess(data.user);

      } catch (error) {
        console.error("Authentication error:", error);

        setError(
          error.message || "Unable to connect. Please try again."
        );
      }
    }

    // ==========================================
    // START
    // ==========================================

    authenticate();
  </script>
</body>
</html>
