<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Account check</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg1:#070b1c;--bg2:#121d42;--muted:#b4bfd9;
  --g-load:linear-gradient(135deg,#4facfe,#8e5bff 55%,#ff5fd2);
  --g-ok:linear-gradient(135deg,#00e5a0,#00c2ff);
  --g-bad:linear-gradient(135deg,#ff5f6d,#ff2d87);
  --g-warn:linear-gradient(135deg,#ffe259,#ff8a1f);
  --g-err:linear-gradient(135deg,#8e7bff,#3d6bff);
  --glow:#8e5bff;
}
html,body{height:100%}
body{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Ethiopic",Arial,sans-serif;
  background:
    radial-gradient(520px 340px at 8% 6%,rgba(79,172,254,.34),transparent 60%),
    radial-gradient(520px 360px at 96% 96%,rgba(255,95,210,.26),transparent 60%),
    radial-gradient(420px 300px at 94% 6%,rgba(0,229,160,.18),transparent 60%),
    radial-gradient(380px 280px at 4% 96%,rgba(255,200,60,.12),transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
}
.card{
  width:100%;max-width:400px;text-align:center;padding:38px 24px 26px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:30px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 28px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
}
.badge{
  position:relative;width:116px;height:116px;margin:0 auto 26px;border-radius:50%;
  display:grid;place-items:center;background:var(--g-load);
  box-shadow:0 16px 46px color-mix(in srgb,var(--glow) 62%,transparent),inset 0 2px 0 rgba(255,255,255,.4);
  transition:background .35s,box-shadow .35s;
}
.badge svg{width:60px;height:60px;display:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
.badge[data-state=loading] .i-load,
.badge[data-state=success] .i-ok,
.badge[data-state=banned] .i-ban,
.badge[data-state=warning] .i-warn,
.badge[data-state=error] .i-err{display:block;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.badge[data-state=loading]{background:var(--g-load);--glow:#8e5bff}
.badge[data-state=success]{background:var(--g-ok);--glow:#00e5a0}
.badge[data-state=banned]{background:var(--g-bad);--glow:#ff3d78}
.badge[data-state=warning]{background:var(--g-warn);--glow:#ffa726}
.badge[data-state=error]{background:var(--g-err);--glow:#6f7cff}
.ring{
  position:absolute;inset:-10px;border-radius:50%;display:none;
  border:3px solid transparent;border-top-color:#fff;border-right-color:rgba(255,255,255,.3);
  animation:spin 1.1s linear infinite;
}
.badge[data-state=loading] .ring{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

h1{font-size:25px;font-weight:750;letter-spacing:-.3px;margin-bottom:10px}
.msg{color:var(--muted);font-size:15px;line-height:1.6;min-height:48px}

.btn{
  display:none;width:100%;margin-top:22px;padding:15px 18px;border:0;border-radius:17px;
  color:#fff;font-size:16px;font-weight:650;cursor:pointer;
  align-items:center;justify-content:center;gap:9px;transition:transform .12s,filter .12s;
}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.ok{background:var(--g-ok);box-shadow:0 10px 28px rgba(0,229,160,.34)}
.btn.retry{background:var(--g-err);box-shadow:0 10px 28px rgba(111,124,255,.36)}

.chips{display:flex;gap:10px;margin-top:28px}
.chip{
  flex:1;padding:13px 6px 11px;border-radius:18px;font-size:12.5px;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
}
.chip span{
  width:40px;height:40px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4);
}
.chip svg{width:22px;height:22px}
.chip:nth-child(1) span{background:linear-gradient(135deg,#00e5a0,#00c2ff)}
.chip:nth-child(2) span{background:linear-gradient(135deg,#ffe259,#ff8a1f)}
.chip:nth-child(3) span{background:linear-gradient(135deg,#d46bff,#4f7bff)}

@media (prefers-reduced-motion:reduce){
  .ring{animation-duration:2.6s}.badge svg{animation:none!important}
}
</style>
</head>
<body>
<main class="card">

  <div class="badge" id="badge" data-state="loading" aria-live="polite">
    <div class="ring"></div>
    <svg class="i-load" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.2c0 4.6-3.1 8.4-7.5 9.8-4.4-1.4-7.5-5.2-7.5-9.8V6L12 3z" fill="rgba(255,255,255,.22)"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>
    <svg class="i-ok" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-width="1.8" fill="rgba(255,255,255,.22)"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <svg class="i-ban" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5" fill="rgba(255,255,255,.22)"/><path d="M5.5 5.5l13 13"/></svg>
    <svg class="i-warn" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l9.6 16.6H2.4L12 3.2z" fill="rgba(255,255,255,.22)"/><path d="M12 9.8v4.6"/><circle cx="12" cy="17.3" r=".5" fill="#fff"/></svg>
    <svg class="i-err" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5" stroke-width="1.8" fill="rgba(255,255,255,.22)"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>
  </div>

  <h1 id="title">Checking your account</h1>
  <p class="msg" id="message">Please wait a moment while we securely check your account.</p>

  <button class="btn ok" id="doneBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg>
    Continue in Telegram
  </button>
  <button class="btn retry" id="retryBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 6.1"/><path d="M20 4v7h-7"/></svg>
    Try again
  </button>

  <div class="chips" aria-hidden="true">
    <div class="chip"><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.2c0 4.6-3.1 8.4-7.5 9.8-4.4-1.4-7.5-5.2-7.5-9.8V6L12 3z"/></svg></span>Secure</div>
    <div class="chip"><span><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg></span>Fast</div>
    <div class="chip"><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></span>Private</div>
  </div>
</main>

<script>
const tg=(window.Telegram&&window.Telegram.WebApp)||{initData:"",ready(){},expand(){},close(){window.close()}};
try{tg.ready();tg.expand()}catch(e){}

const API_BASE="https://adewa.vercel.app";

function getDeviceId(){
  let id=null;
  try{id=localStorage.getItem("device_installation_id")}catch(e){}
  if(!id){
    id=(crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random().toString(16).slice(2);
    try{localStorage.setItem("device_installation_id",id)}catch(e){}
  }
  return id;
}

const $=id=>document.getElementById(id);

function setState(state,title,message){
  $("badge").dataset.state=state;
  $("title").textContent=title;
  $("message").textContent=message;
  $("doneBtn").style.display=state==="success"?"flex":"none";
  $("retryBtn").style.display=(state==="error"||state==="warning")?"flex":"none";
}

let busy=false;
async function verify(){
  if(busy)return;
  busy=true;
  setState("loading","Checking your account","Please wait a moment while we securely check your account.");
  try{
    const initData=tg.initData;
    if(!initData){
      setState("warning","Open from Telegram","Telegram data is missing. Please open this page from the Telegram bot.");
      return;
    }
    const res=await fetch(`${API_BASE}/api/auth`,{
      method:"POST",
      headers:{"Content-Type":"application/json","x-init-data":initData,"x-device":getDeviceId()}
    });
    const data=await res.json();

    if(data.ok===true&&data.status==="verified"){
      setState("success","You're all set","Tap the button below to go back to Telegram.");
      return;
    }
    if(data.status==="banned"){
      setState("banned","Access blocked",data.message||"Your account has been blocked.");
      return;
    }
    setState("error","Something went wrong",data.message||"Please try again.");
  }catch(err){
    console.error(err);
    setState("error","No connection","Could not reach the server. Check your internet and try again.");
  }finally{
    busy=false;
  }
}

$("retryBtn").addEventListener("click",verify);
$("doneBtn").addEventListener("click",()=>tg.close());
verify();
</script>
</body>
</html>
